name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Test
        run: bun test

      # Compile failures only surface at build time, so build one target.
      - name: Build
        run: |
          bun build ./src/main.ts --compile --target=bun-linux-x64 \
            --outfile build/dot-linux-x64
          ./build/dot-linux-x64 --help | grep -q "link"
