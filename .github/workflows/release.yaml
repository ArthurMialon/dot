name: Release CLI

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - package.json
      - bun.lock
      - tsconfig.json

# Never cancel a release that is already publishing artifacts.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Test
        run: bun test

      - name: Generate version
        id: version
        uses: paulhatch/semantic-version@v5.3.0
        with:
          tag_prefix: "v"
          major_pattern: "BREAKING CHANGE:"
          minor_pattern: "feat:"

      - name: Build CLI for all targets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            echo "Building dot-$target"
            bun build ./src/main.ts \
              --compile \
              --sourcemap \
              --target="bun-$target" \
              --define "process.env.DOT_VERSION=\"$VERSION\"" \
              --outfile "build/dot-$target"
          done

      - name: Smoke test the linux-x64 binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x ./build/dot-linux-x64
          test "$(./build/dot-linux-x64 --version)" = "$VERSION"
          ./build/dot-linux-x64 --help | grep -q "link"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: ./build/dot-*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
